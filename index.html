<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новогодний планировщик 🎄</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
    /* ============ БАЗА ============ */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { scroll-behavior: smooth; }

    html { font-size: 17px; }

    body {
        font-family: 'Nunito', 'Comfortaa', system-ui, sans-serif;
        font-size: 1rem;
        min-height: 100vh;
        background: linear-gradient(160deg, #ffffff 0%, #e8f4fd 40%, #c9e8fa 100%);
        color: #1e3a5f;
        position: relative;
        overflow-x: hidden;
    }

    h1, h2, h3, .tab-btn, .dish-category-header, .section-header h2 {
        font-family: 'Comfortaa', 'Nunito', sans-serif;
        letter-spacing: 0.3px;
    }

    #snowCanvas {
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        pointer-events: none;
        z-index: 0;
    }

    .app-wrapper {
        position: relative;
        z-index: 1;
        max-width: 1400px;
        margin: 0 auto;
        padding: 20px 24px 60px;
    }

    /* ============ ШАПКА ============ */
    header { text-align: center; padding: 30px 0 10px; }

    h1 {
        font-size: 3.1rem;
        font-weight: 700;
        background: linear-gradient(135deg, #2c5282, #5a9fd4, #2c5282);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: 1px;
        filter: drop-shadow(0 2px 6px rgba(255,255,255,0.8));
    }

    .subtitle {
        font-size: 1.15rem;
        color: #5a7d9a;
        margin-top: 6px;
        font-style: italic;
        font-family: 'Nunito', sans-serif;
    }

    /* ============ ВКЛАДКИ ============ */
    .tabs { display: flex; justify-content: center; gap: 12px; margin: 28px 0 32px; }

    .tab-btn {
        padding: 14px 38px;
        border: 1.5px solid #b8d8f0;
        background: linear-gradient(135deg, rgba(255,255,255,0.85), rgba(240,248,255,0.6));
        backdrop-filter: blur(8px);
        border-radius: 40px;
        font-size: 1.1rem;
        font-weight: 600;
        color: #3a5a7a;
        cursor: pointer;
        transition: all 0.25s ease;
        box-shadow: 0 4px 14px rgba(160, 200, 230, 0.25), inset 0 1px 0 rgba(255,255,255,0.8);
        position: relative;
    }

    .tab-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 22px rgba(107, 163, 214, 0.35), inset 0 1px 0 rgba(255,255,255,0.8);
        border-color: #8bbde0;
    }

    .tab-btn.active {
        background: linear-gradient(135deg, #7fb8e0, #5a9fd4);
        border-color: #5a9fd4;
        color: #ffffff;
        box-shadow: 0 8px 24px rgba(90, 159, 212, 0.45), inset 0 1px 0 rgba(255,255,255,0.3);
    }

    .tab-content { display: none; animation: fadeIn 0.35s ease; }
    .tab-content.active { display: block; }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* ============ БЛОКИ ============ */
    .section-card {
        background: linear-gradient(160deg, rgba(255,255,255,0.92) 0%, rgba(235,246,255,0.82) 100%);
        backdrop-filter: blur(14px);
        border: 1.5px solid rgba(180, 215, 240, 0.85);
        border-radius: 28px;
        margin-bottom: 32px;
        box-shadow:
            0 12px 40px rgba(150, 195, 225, 0.25),
            inset 0 1px 0 rgba(255,255,255,0.7);
        overflow: hidden;
        position: relative;
    }

    .section-card::after {
        content: '';
        position: absolute;
        top: -40px;
        right: -40px;
        width: 160px;
        height: 160px;
        background: radial-gradient(circle, rgba(180, 215, 240, 0.35), transparent 70%);
        pointer-events: none;
        border-radius: 50%;
    }

    .section-header {
        padding: 22px 30px;
        background: linear-gradient(135deg, rgba(212, 234, 252, 0.55), rgba(255, 255, 255, 0.25));
        border-bottom: 1.5px solid rgba(200, 225, 245, 0.7);
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
        position: relative;
        z-index: 1;
    }

    .section-header h2 { font-size: 1.55rem; font-weight: 700; color: #2c5282; }

    .section-body { padding: 24px 30px 28px; position: relative; z-index: 1; }

    /* ============ КНОПКИ ============ */
    .btn-primary {
        padding: 12px 28px;
        border: 1.5px solid transparent;
        border-radius: 40px;
        background: linear-gradient(135deg, #7fb8e0, #5a9fd4);
        color: #ffffff;
        font-weight: 700;
        font-size: 1rem;
        font-family: 'Nunito', sans-serif;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(90, 159, 212, 0.35), inset 0 1px 0 rgba(255,255,255,0.3);
        transition: all 0.22s ease;
        white-space: nowrap;
        letter-spacing: 0.3px;
    }

    .btn-primary:hover {
        background: linear-gradient(135deg, #6aace0, #4a8fc4);
        box-shadow: 0 8px 22px rgba(90, 159, 212, 0.45), inset 0 1px 0 rgba(255,255,255,0.3);
        transform: translateY(-1px);
    }

    .btn-primary:active { transform: translateY(0); }

    .btn-outline {
        padding: 10px 22px;
        border: 1.5px solid #a0c8e8;
        border-radius: 40px;
        background: linear-gradient(135deg, rgba(255,255,255,0.7), rgba(240,248,255,0.4));
        color: #3a5a7a;
        font-weight: 600;
        font-size: 0.95rem;
        font-family: 'Nunito', sans-serif;
        cursor: pointer;
        transition: all 0.22s ease;
    }

    .btn-outline:hover {
        background: #eaf4fc;
        border-color: #7fb8e0;
        transform: translateY(-1px);
    }

    .btn-small { padding: 8px 18px; font-size: 0.9rem; }

    /* ============ ПРОДУКТЫ ============ */
    .products-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
        gap: 20px;
    }

    .product-column h3 {
        font-size: 0.95rem;
        font-weight: 700;
        color: #4a6a8a;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        padding-bottom: 8px;
        margin-bottom: 8px;
        border-bottom: 1.5px solid #cde4f5;
    }

    .product-item {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 7px 6px 7px 2px;
        font-size: 1rem;
        color: #2c3e50;
        border-radius: 10px;
        transition: background 0.2s;
    }

    .product-item:hover { background: rgba(220, 240, 255, 0.65); }

    .product-item input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: #5a9fd4;
        cursor: pointer;
        flex-shrink: 0;
    }

    .product-item span {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .product-item.checked span {
        text-decoration: line-through;
        opacity: 0.55;
    }

    .product-delete {
        margin-left: auto;
        background: transparent;
        border: none;
        color: #c0d4e8;
        cursor: pointer;
        font-size: 1.25rem;
        line-height: 1;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transition: all 0.2s;
        flex-shrink: 0;
    }

    .product-item:hover .product-delete { opacity: 1; }
    .product-delete:hover { background: #fde8e8; color: #d45a5a; }

    .empty-hint {
        font-size: 0.9rem;
        color: #99b8d0;
        font-style: italic;
        padding: 4px 0;
    }

    /* ============ БЛЮДА: СЕТКА КАРТОЧЕК (НЕ В ОДНУ ЛИНИЮ) ============ */
    .dishes-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
        gap: 20px;
        max-width: 940px;
        margin: 0 auto;
    }

    .dish-category-card {
        background: linear-gradient(160deg, #ffffff 0%, #f5faff 100%);
        border: 1.5px solid #cde4f5;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 6px 20px rgba(150, 195, 225, 0.18), inset 0 1px 0 rgba(255,255,255,0.9);
        display: flex;
        flex-direction: column;
        transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .dish-category-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 28px rgba(150, 195, 225, 0.3), inset 0 1px 0 rgba(255,255,255,0.9);
    }

    .dish-category-header {
        padding: 16px 14px;
        font-weight: 700;
        font-size: 1.1rem;
        color: #2c5282;
        text-align: center;
        letter-spacing: 0.5px;
        border-bottom: 1.5px solid rgba(200, 225, 245, 0.7);
        background: linear-gradient(135deg, #e8f4fc, #d4ebfa);
    }

    .dish-category-card.salads .dish-category-header { background: linear-gradient(135deg, #d8f0d8, #eafae8); }
    .dish-category-card.snacks .dish-category-header { background: linear-gradient(135deg, #fde4c8, #fff2e0); }
    .dish-category-card.hot .dish-category-header    { background: linear-gradient(135deg, #fdd4d4, #ffe8e8); }
    .dish-category-card.side .dish-category-header   { background: linear-gradient(135deg, #fdf0c8, #fffae0); }
    .dish-category-card.tea .dish-category-header    { background: linear-gradient(135deg, #f8d4e8, #fde8f2); }

    .dish-list {
        padding: 10px;
        flex: 1;
        min-height: 80px;
    }

    .dish-entry {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 9px 10px;
        border-radius: 12px;
        margin-bottom: 4px;
        transition: background 0.2s;
    }

    .dish-entry:hover { background: rgba(220, 240, 255, 0.55); }

    .dish-entry a {
        font-size: 1rem;
        font-weight: 600;
        color: #2c5282;
        text-decoration: none;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        border-bottom: 1px dashed transparent;
        transition: all 0.2s;
    }

    .dish-entry a:hover { color: #4a8fc4; border-bottom-color: #8bbde0; }

    .dish-actions {
        display: flex;
        gap: 2px;
        opacity: 0;
        transition: opacity 0.2s;
    }

    .dish-entry:hover .dish-actions { opacity: 1; }

    .icon-btn {
        background: transparent;
        border: none;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.95rem;
        color: #7a9ab8;
        transition: all 0.2s;
        flex-shrink: 0;
    }

    .icon-btn:hover { background: #eaf4fc; color: #4a8fc4; }
    .icon-btn.delete:hover { background: #fde8e8; color: #d45a5a; }

    .dish-empty {
        font-size: 0.92rem;
        color: #b0c8dc;
        font-style: italic;
        text-align: center;
        padding: 14px 0;
    }

    /* ============ ДЕКОР ============ */
    .decor-notes {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 20px;
    }

    .note-field { display: flex; flex-direction: column; gap: 8px; }

    .note-field label {
        font-weight: 700;
        font-size: 1.05rem;
        color: #3a5a7a;
        font-family: 'Comfortaa', sans-serif;
    }

    .note-field textarea {
        resize: vertical;
        min-height: 100px;
        padding: 12px 14px;
        border: 1.5px solid #cde4f5;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.85);
        font-family: 'Nunito', sans-serif;
        font-size: 1rem;
        color: #1e3a5f;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    .note-field textarea:focus {
        outline: none;
        border-color: #7fb8e0;
        box-shadow: 0 0 0 3px rgba(127, 184, 224, 0.2);
    }

    /* ============ МОДАЛЬНЫЕ ОКНА ============ */
    .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(30, 58, 95, 0.38);
        backdrop-filter: blur(4px);
        z-index: 100;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .modal-overlay.open { display: flex; }
    .modal-overlay.modal-nested { z-index: 200; background: rgba(30, 58, 95, 0.2); }

    .modal-box {
        background: #ffffff;
        border-radius: 26px;
        padding: 34px 36px;
        width: 100%;
        max-width: 780px;
        max-height: 88vh;
        overflow-y: auto;
        box-shadow: 0 24px 60px rgba(30, 58, 95, 0.25);
        animation: modalIn 0.25s ease;
        position: relative;
    }

    @keyframes modalIn {
        from { opacity: 0; transform: scale(0.96) translateY(10px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-box h3 {
        font-size: 1.5rem;
        color: #2c5282;
        margin-bottom: 22px;
        padding-right: 30px;
    }

    .modal-close {
        position: absolute;
        top: 16px;
        right: 20px;
        background: none;
        border: none;
        font-size: 1.9rem;
        color: #99b8d0;
        cursor: pointer;
        transition: color 0.2s;
        line-height: 1;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .modal-close:hover { color: #5a9fd4; background: #eaf4fc; }

    .form-group { margin-bottom: 18px; }

    .form-group label,
    .recipe-section-label {
        display: block;
        font-weight: 700;
        font-size: 0.98rem;
        color: #3a5a7a;
        margin-bottom: 7px;
        font-family: 'Nunito', sans-serif;
    }

    .form-group select,
    .form-group input[type="text"],
    .form-group textarea {
        width: 100%;
        padding: 11px 15px;
        border: 1.5px solid #cde4f5;
        border-radius: 12px;
        font-family: 'Nunito', sans-serif;
        font-size: 1rem;
        color: #1e3a5f;
        background: #f8fcff;
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group select:focus,
    .form-group input:focus,
    .form-group textarea:focus {
        outline: none;
        border-color: #7fb8e0;
        box-shadow: 0 0 0 3px rgba(127, 184, 224, 0.2);
    }

    .recipe-modal-layout {
        display: grid;
        grid-template-columns: 1fr 260px;
        gap: 26px;
    }

    .step-row {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
        align-items: flex-start;
    }

    .step-number {
        flex-shrink: 0;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: linear-gradient(135deg, #eaf4fc, #d4ebfa);
        color: #4a8fc4;
        font-weight: 700;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 8px;
        border: 1px solid #cde4f5;
    }

    .step-row textarea {
        flex: 1;
        min-height: 58px;
        padding: 10px 14px;
        border: 1.5px solid #cde4f5;
        border-radius: 10px;
        font-family: 'Nunito', sans-serif;
        font-size: 0.98rem;
        resize: vertical;
        background: #f8fcff;
        color: #1e3a5f;
    }

    .step-row textarea:focus { outline: none; border-color: #7fb8e0; box-shadow: 0 0 0 3px rgba(127,184,224,0.15); }

    .step-delete {
        background: transparent;
        border: none;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        color: #c0d4e8;
        cursor: pointer;
        font-size: 1.4rem;
        line-height: 1;
        margin-top: 8px;
        transition: all 0.2s;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .step-delete:hover { background: #fde8e8; color: #d45a5a; }

    .products-picker {
        border: 1.5px solid #cde4f5;
        border-radius: 14px;
        padding: 14px;
        background: #f8fcff;
        max-height: 340px;
        overflow-y: auto;
    }

    .products-picker .product-item { font-size: 0.95rem; padding: 6px 4px; }
    .products-picker .product-item label { cursor: pointer; flex: 1; }

    .selected-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        min-height: 32px;
        margin-bottom: 16px;
    }

    .selected-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 5px 8px 5px 13px;
        background: linear-gradient(135deg, #e8f4fc, #d4ebfa);
        border: 1px solid #b8d8f0;
        border-radius: 20px;
        font-size: 0.88rem;
        color: #3a5a7a;
        font-weight: 600;
    }

    .selected-chip button {
        background: none;
        border: none;
        cursor: pointer;
        color: #7a9ab8;
        font-size: 1.05rem;
        line-height: 1;
        padding: 0;
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        transition: all 0.15s;
    }

    .selected-chip button:hover { background: #fde8e8; color: #d45a5a; }

    .photo-upload-area {
        border: 2px dashed #b8d8f0;
        border-radius: 14px;
        padding: 18px;
        text-align: center;
        color: #7a9ab8;
        font-size: 0.95rem;
        margin-top: 8px;
        transition: border-color 0.2s, background 0.2s;
        background: #f8fcff;
    }

    .photo-upload-area:hover { border-color: #7fb8e0; background: #f0f8ff; }
    .photo-upload-area input[type="file"] { display: none; }
    .photo-upload-label { cursor: pointer; display: block; font-weight: 600; }

    .photo-preview { margin-top: 10px; }

    .photo-preview img {
        max-width: 100%;
        max-height: 150px;
        border-radius: 12px;
        object-fit: cover;
        border: 1.5px solid #cde4f5;
    }

    .url-input { margin-top: 10px; }

    .url-input input {
        width: 100%;
        padding: 9px 13px;
        border: 1.5px solid #cde4f5;
        border-radius: 10px;
        font-size: 0.9rem;
        font-family: 'Nunito', sans-serif;
        background: #f8fcff;
        color: #1e3a5f;
    }

    .url-input input:focus { outline: none; border-color: #7fb8e0; }

    /* ============ ПРОСМОТР РЕЦЕПТА ============ */
    .recipe-view-layout {
        display: grid;
        grid-template-columns: 1fr 220px;
        gap: 26px;
    }

    .recipe-view-image {
        width: 100%;
        height: 180px;
        border-radius: 16px;
        object-fit: cover;
        border: 1.5px solid #cde4f5;
        background: #eaf4fc;
    }

    .recipe-view-image-placeholder {
        width: 100%;
        height: 180px;
        border-radius: 16px;
        background: linear-gradient(135deg, #eaf4fc, #d4ebfa);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3.6rem;
        color: #8bbde0;
        border: 1.5px solid #cde4f5;
    }

    .fact-box {
        background: linear-gradient(135deg, #fff9e6, #fff4d6);
        border-left: 4px solid #f0c040;
        border-radius: 10px;
        padding: 14px 18px;
        font-size: 1rem;
        color: #5a4a1a;
        margin-bottom: 20px;
        line-height: 1.6;
    }

    .fact-box strong { color: #8a6a10; }

    .recipe-steps-view { list-style: none; counter-reset: step-counter; }

    .recipe-steps-view li {
        counter-increment: step-counter;
        margin-bottom: 13px;
        padding-left: 36px;
        position: relative;
        font-size: 1rem;
        line-height: 1.6;
        color: #2c3e50;
    }

    .recipe-steps-view li::before {
        content: counter(step-counter);
        position: absolute;
        left: 0;
        top: 0;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: linear-gradient(135deg, #eaf4fc, #d4ebfa);
        color: #4a8fc4;
        font-weight: 700;
        font-size: 0.85rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #cde4f5;
    }

    .recipe-ingredients {
        font-size: 0.95rem;
        color: #5a7d9a;
        margin-top: 16px;
        font-style: italic;
        padding-top: 14px;
        border-top: 1px dashed #cde4f5;
    }

    .view-actions {
        display: flex;
        gap: 10px;
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1.5px solid #eaf4fc;
    }

    .btn-danger {
        padding: 10px 22px;
        border: 1.5px solid #fdd4d4;
        border-radius: 40px;
        background: linear-gradient(135deg, #fff5f5, #ffe8e8);
        color: #d45a5a;
        font-weight: 600;
        font-size: 0.95rem;
        font-family: 'Nunito', sans-serif;
        cursor: pointer;
        transition: all 0.2s;
    }

    .btn-danger:hover { background: #fdd4d4; }

<script>
    // ============================================================
    // 1. СНЕЖИНКИ (крупные, красивые, шестилучёвые)
    // ============================================================
    const canvas = document.getElementById('snowCanvas');
    const ctx = canvas.getContext('2d');
    let W, H;
    let snowflakes = [];

    function resizeCanvas() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = window.innerHeight;
    }

    class Snowflake {
        constructor() { this.reset(true); }
        reset(initial = false) {
            this.x = Math.random() * W;
            this.y = initial ? Math.random() * H : -20;
            this.size = Math.random() * 6 + 4;          // 4–10 px — заметные
            this.speedY = Math.random() * 1.2 + 0.5;     // падают плавно
            this.speedX = Math.random() * 0.8 - 0.4;
            this.opacity = Math.random() * 0.35 + 0.55;  // 0.55–0.9 — хорошо видно
            this.rotation = Math.random() * Math.PI * 2;
            this.rotationSpeed = (Math.random() - 0.5) * 0.025;
            this.swing = Math.random() * Math.PI * 2;
            this.swingSpeed = Math.random() * 0.03 + 0.01;
            this.windGust = 0;
            this.windTimer = Math.random() * 200;
        }
        update() {
            // случайные порывы ветра для хаотичности
            this.windTimer--;
            if (this.windTimer <= 0) {
                this.windGust = (Math.random() - 0.5) * 1.5;
                this.windTimer = 100 + Math.random() * 200;
            }
            this.y += this.speedY;
            this.swing += this.swingSpeed;
            this.x += Math.sin(this.swing) * 0.7 + this.speedX + this.windGust * 0.5;
            this.rotation += this.rotationSpeed;
            if (this.y > H + 20) { this.reset(); this.y = -20; }
            if (this.x > W + 20) this.x = -20;
            if (this.x < -20) this.x = W + 20;
        }
        draw() {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation);
            ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity})`;
            ctx.lineWidth = 1.6;
            ctx.lineCap = 'round';
            ctx.shadowColor = 'rgba(200, 230, 255, 0.95)';
            ctx.shadowBlur = 10;

            // 6 лучей
            for (let i = 0; i < 6; i++) {
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(0, -this.size);
                ctx.stroke();

                // боковые веточки
                ctx.beginPath();
                ctx.moveTo(0, -this.size * 0.55);
                ctx.lineTo(this.size * 0.32, -this.size * 0.78);
                ctx.moveTo(0, -this.size * 0.55);
                ctx.lineTo(-this.size * 0.32, -this.size * 0.78);
                ctx.stroke();

                // маленькие веточки у кончика
                ctx.beginPath();
                ctx.moveTo(0, -this.size * 0.8);
                ctx.lineTo(this.size * 0.2, -this.size * 0.95);
                ctx.moveTo(0, -this.size * 0.8);
                ctx.lineTo(-this.size * 0.2, -this.size * 0.95);
                ctx.stroke();

                ctx.rotate(Math.PI / 3);
            }
            ctx.restore();
        }
    }

    function initSnow() {
        resizeCanvas();
        snowflakes = [];
        const count = Math.floor((W * H) / 16000); // плотность
        for (let i = 0; i < Math.max(count, 30); i++) {
            snowflakes.push(new Snowflake());
        }
    }

    function animateSnow() {
        ctx.clearRect(0, 0, W, H);
        ctx.shadowBlur = 0;
        snowflakes.forEach(f => { f.update(); f.draw(); });
        requestAnimationFrame(animateSnow);
    }

    window.addEventListener('resize', () => { resizeCanvas(); initSnow(); });
    initSnow();
    animateSnow();

            const items = products[key] || [];
            if (items.length === 0) {
                const hint = document.createElement('div');
                hint.className = 'empty-hint';
                hint.textContent = 'Пока пусто';
                col.appendChild(hint);
            } else {
                items.forEach((item, idx) => {
                    const div = document.createElement('div');
                    div.className = 'product-item' + (item.checked ? ' checked' : '');
                    const cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.checked = item.checked;
                    cb.addEventListener('change', () => {
                        item.checked = cb.checked;
                        div.classList.toggle('checked', item.checked);
                    });
                    const span = document.createElement('span');
                    span.textContent = item.name;

                    const del = document.createElement('button');
                    del.className = 'product-delete';
                    del.innerHTML = '×';
                    del.title = 'Удалить';
                    del.addEventListener('click', (e) => {
                        e.stopPropagation();
                        products[key].splice(idx, 1);
                        renderProducts();
                    });

                    div.appendChild(cb);
                    div.appendChild(span);
                    div.appendChild(del);
                    col.appendChild(div);
                });
            }
            grid.appendChild(col);
        }
    }

    function renderDishes() {
        const grid = document.getElementById('dishesGrid');
        grid.innerHTML = '';
        for (const [key, label] of Object.entries(dishCategories)) {
            const card = document.createElement('div');
            card.className = 'dish-category-card ' + key;

            const header = document.createElement('div');
            header.className = 'dish-category-header';
            header.textContent = label;
            card.appendChild(header);

            const list = document.createElement('div');
            list.className = 'dish-list';

            const items = dishes[key] || [];
            if (items.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'dish-empty';
                empty.textContent = 'Нет блюд';
                list.appendChild(empty);
            } else {
                items.forEach((dish, idx) => {
                    const entry = document.createElement('div');
                    entry.className = 'dish-entry';

                    const link = document.createElement('a');
                    link.href = '#';
                    link.textContent = dish.name;
                    link.addEventListener('click', (e) => {
                        e.preventDefault();
                        openRecipeView(dish, key, idx);
                    });
                    entry.appendChild(link);

                    const actions = document.createElement('div');
                    actions.className = 'dish-actions';

                    const editBtn = document.createElement('button');
                    editBtn.className = 'icon-btn';
                    editBtn.innerHTML = '✎';
                    editBtn.title = 'Редактировать';
                    editBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        openRecipeEditor(dish, key, idx);
                    });
                    actions.appendChild(editBtn);

                    const delBtn = document.createElement('button');
                    delBtn.className = 'icon-btn delete';
                    delBtn.innerHTML = '✕';
                    delBtn.title = 'Удалить';
                    delBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        deleteDish(key, idx);
                    });
                    actions.appendChild(delBtn);

                    entry.appendChild(actions);
                    list.appendChild(entry);
                });
            }

            card.appendChild(list);
            grid.appendChild(card);
        }
    }

    function renderDecor() {
        const grid = document.getElementById('decorGrid');
        grid.innerHTML = '';
        for (const [key, label] of Object.entries(decorCategories)) {
            const col = document.createElement('div');
            col.className = 'product-column';
            const h3 = document.createElement('h3');
            h3.textContent = label;
            col.appendChild(h3);

            const items = decorItems[key] || [];
            if (items.length === 0) {
                const hint = document.createElement('div');
                hint.className = 'empty-hint';
                hint.textContent = 'Пока пусто';
                col.appendChild(hint);
            } else {
                items.forEach((item, idx) => {
                    const div = document.createElement('div');
                    div.className = 'product-item' + (item.checked ? ' checked' : '');
                    const cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.checked = item.checked;
                    cb.addEventListener('change', () => {
                        item.checked = cb.checked;
                        div.classList.toggle('checked', item.checked);
                    });
                    const span = document.createElement('span');
                    span.textContent = item.name;

                    const del = document.createElement('button');
                    del.className = 'product-delete';
                    del.innerHTML = '×';
                    del.title = 'Удалить';
                    del.addEventListener('click', (e) => {
                        e.stopPropagation();
                        decorItems[key].splice(idx, 1);
                        renderDecor();
                    });

                    div.appendChild(cb);
                    div.appendChild(span);
                    div.appendChild(del);
                    col.appendChild(div);
                });
            }
            grid.appendChild(col);
        }
    }

    // ============================================================
    // 4. ВКЛАДКИ
    // ============================================================
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(s => s.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
        });
    });

    // ============================================================
    // 5. МОДАЛКИ
    // ============================================================
    function openModal(id) { document.getElementById(id).classList.add('open'); }
    function closeModal(id) { document.getElementById(id).classList.remove('open'); }

    document.querySelectorAll('[data-close]').forEach(btn => {
        btn.addEventListener('click', () => closeModal(btn.dataset.close));
    });

    document.querySelectorAll('.modal-overlay').forEach(overlay => {
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) overlay.classList.remove('open');
        });
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            document.querySelectorAll('.modal-overlay.open').forEach(m => m.classList.remove('open'));
        }
    });

    // ============================================================
    // 6. ПРОДУКТЫ — ДОБАВЛЕНИЕ
    // ============================================================
    document.getElementById('btnAddProduct').addEventListener('click', () => {
        document.getElementById('productName').value = '';
        openModal('modalAddProduct');
        setTimeout(() => document.getElementById('productName').focus(), 100);
    });

    document.getElementById('btnSaveProduct').addEventListener('click', () => {
        const category = document.getElementById('productCategory').value;
        const name = document.getElementById('productName').value.trim();
        if (!name) { alert('Введите название продукта.'); return; }
        if (!products[category]) products[category] = [];
        products[category].push({ name, checked: false });
        renderProducts();
        closeModal('modalAddProduct');
    });

    // ============================================================
    // 7. ДЕКОР — ДОБАВЛЕНИЕ
    // ============================================================
    document.getElementById('btnAddDecorItem').addEventListener('click', () => {
        document.getElementById('decorName').value = '';
        openModal('modalAddDecorItem');
        setTimeout(() => document.getElementById('decorName').focus(), 100);
    });

    document.getElementById('btnSaveDecorItem').addEventListener('click', () => {
        const category = document.getElementById('decorCategory').value;
        const name = document.getElementById('decorName').value.trim();
        if (!name) { alert('Введите название предмета.'); return; }
        if (!decorItems[category]) decorItems[category] = [];
        decorItems[category].push({ name, checked: false });
        renderDecor();
        closeModal('modalAddDecorItem');
    });

    // ============================================================
    // 8. РЕЦЕПТЫ — СОЗДАНИЕ / РЕДАКТИРОВАНИЕ
    // ============================================================
    let editingRecipe = null;       // { category, index } | null
    let currentPhotoUrl = '';
    let currentRecipeProducts = [];

    function addStepRow(num, value = '') {
        const container = document.getElementById('recipeStepsContainer');
        const row = document.createElement('div');
        row.className = 'step-row';
        row.innerHTML = `
            <div class="step-number">${num}</div>
            <textarea placeholder="Опишите шаг ${num}…">${value}</textarea>
            <button class="step-delete" title="Удалить шаг">×</button>
        `;
        row.querySelector('.step-delete').addEventListener('click', () => {
            row.remove();
            renumberSteps();
        });
        container.appendChild(row);
    }

    function renumberSteps() {
        document.querySelectorAll('#recipeStepsContainer .step-row').forEach((row, i) => {
            row.querySelector('.step-number').textContent = i + 1;
        });
    }

    function renderSelectedChips() {
        const container = document.getElementById('selectedProductsChips');
        container.innerHTML = '';
        if (currentRecipeProducts.length === 0) {
            container.innerHTML = '<span style="font-size:0.79rem; color:#99b8d0; font-style:italic;">Продукты не выбраны</span>';
            return;
        }
        currentRecipeProducts.forEach((name, i) => {
            const chip = document.createElement('span');
            chip.className = 'selected-chip';
            chip.innerHTML = `<span>${name}</span><button title="Удалить">×</button>`;
            chip.querySelector('button').addEventListener('click', () => {
                currentRecipeProducts.splice(i, 1);
                renderSelectedChips();
            });
            container.appendChild(chip);
        });
    }

    function openRecipeEditor(dish = null, category = null, index = null) {
        editingRecipe = dish ? { category, index } : null;
        currentRecipeProducts = dish && dish.ingredients ? [...dish.ingredients] : [];
        currentPhotoUrl = dish ? (dish.image || '') : '';

        document.getElementById('recipeModalTitle').textContent = dish ? 'Редактировать рецепт' : 'Добавить рецепт';
        document.getElementById('btnSaveRecipe').textContent = dish ? 'Сохранить изменения' : 'Добавить рецепт';
        document.getElementById('recipeName').value = dish ? dish.name : '';
        document.getElementById('recipeCategory').value = category || 'salads';
        document.getElementById('recipeFact').value = dish ? (dish.fact || '') : '';

        const container = document.getElementById('recipeStepsContainer');
        container.innerHTML = '';
        const stepsToShow = dish && dish.steps && dish.steps.length > 0 ? dish.steps : [''];
        stepsToShow.forEach((step, i) => addStepRow(i + 1, step));

        document.getElementById('recipePhotoFile').value = '';
        document.getElementById('recipePhotoUrl').value =
            (dish && dish.image && !dish.image.startsWith('blob:')) ? dish.image : '';
        const preview = document.getElementById('photoPreview');
        if (dish && dish.image) {
            preview.innerHTML = `<img src="${dish.image}" alt="Превью" onerror="this.style.display='none'">`;
        } else {
            preview.innerHTML = '';
        }

        renderSelectedChips();
        openModal('modalAddRecipe');
    }

    document.getElementById('btnAddRecipe').addEventListener('click', () => openRecipeEditor());
    document.getElementById('btnAddStep').addEventListener('click', () => {
        const count = document.querySelectorAll('#recipeStepsContainer .step-row').length + 1;
        addStepRow(count);
    });

    // ---- Продукты: выбор ----
    document.getElementById('btnPickProducts').addEventListener('click', () => {
        renderProductsPicker();
        openModal('modalPickProducts');
    });

    function renderProductsPicker() {
        const container = document.getElementById('productsPickerContainer');
        container.innerHTML = '';
        let hasAny = false;
        for (const [key, label] of Object.entries(productCategories)) {
            const items = products[key] || [];
            if (items.length === 0) continue;
            hasAny = true;
            const groupLabel = document.createElement('div');
            groupLabel.style.cssText = 'font-weight:700; font-size:0.74rem; color:#7a9ab8; margin:8px 0 4px; text-transform:uppercase; letter-spacing:0.6px;';
            groupLabel.textContent = label;
            container.appendChild(groupLabel);

            items.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = 'product-item';
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.dataset.category = key;
                cb.dataset.index = idx;
                cb.id = `pick-${key}-${idx}`;
                cb.checked = currentRecipeProducts.includes(item.name);
                const labelEl = document.createElement('label');
                labelEl.htmlFor = cb.id;
                labelEl.textContent = item.name;
                div.appendChild(cb);
                div.appendChild(labelEl);
                container.appendChild(div);
            });
        }
        if (!hasAny) {
            container.innerHTML = '<div class="empty-hint" style="text-align:center; padding:20px 0;">Сначала добавьте продукты в список на вкладке «Новогодний стол».</div>';
        }
    }

    document.getElementById('btnConfirmProducts').addEventListener('click', () => {
        currentRecipeProducts = [];
        document.querySelectorAll('#productsPickerContainer input[type="checkbox"]:checked').forEach(cb => {
            const cat = cb.dataset.category;
            const idx = parseInt(cb.dataset.index);
            if (products[cat] && products[cat][idx]) {
                currentRecipeProducts.push(products[cat][idx].name);
            }
        });
        renderSelectedChips();
        closeModal('modalPickProducts');
    });

    // ---- Фото ----
    document.getElementById('recipePhotoFile').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file) {
            const url = URL.createObjectURL(file);
            currentPhotoUrl = url;
            document.getElementById('photoPreview').innerHTML = `<img src="${url}" alt="Превью">`;
            document.getElementById('recipePhotoUrl').value = '';
        }
    });

    document.getElementById('recipePhotoUrl').addEventListener('input', (e) => {
        const url = e.target.value.trim();
        if (url) {
            currentPhotoUrl = url;
            document.getElementById('photoPreview').innerHTML =
                `<img src="${url}" alt="Превью" onerror="this.style.display='none'">`;
            document.getElementById('recipePhotoFile').value = '';
        } else {
            currentPhotoUrl = '';
            document.getElementById('photoPreview').innerHTML = '';
        }
    });

    // ---- Сохранение ----
    document.getElementById('btnSaveRecipe').addEventListener('click', () => {
        const category = document.getElementById('recipeCategory').value;
        const name = document.getElementById('recipeName').value.trim();
        if (!name) { alert('Введите название блюда.'); return; }

        const steps = [];
        document.querySelectorAll('#recipeStepsContainer textarea').forEach(ta => {
            const v = ta.value.trim();
            if (v) steps.push(v);
        });
        if (steps.length === 0) { alert('Добавьте хотя бы один шаг.'); return; }

        const fact = document.getElementById('recipeFact').value.trim() ||
            'Это блюдо было добавлено вами! Возможно, у него есть своя уникальная история, которую знаете только вы. 😊';

        const dish = {
            name, fact, steps,
            image: currentPhotoUrl,
            ingredients: [...currentRecipeProducts]
        };

        if (editingRecipe) {
            if (editingRecipe.category !== category) {
                dishes[editingRecipe.category].splice(editingRecipe.index, 1);
                if (!dishes[category]) dishes[category] = [];
                dishes[category].push(dish);
            } else {
                dishes[category][editingRecipe.index] = dish;
            }
        } else {
            if (!dishes[category]) dishes[category] = [];
            dishes[category].push(dish);
        }

        renderDishes();
        editingRecipe = null;
        closeModal('modalAddRecipe');
    });

    // ============================================================
    // 9. ПРОСМОТР И УДАЛЕНИЕ РЕЦЕПТА
    // ============================================================
    let viewingDish = null;

    function openRecipeView(dish, category, index) {
        viewingDish = { dish, category, index };
        document.getElementById('viewRecipeTitle').textContent = dish.name;
        document.getElementById('viewRecipeFact').innerHTML =
            `<strong>😄 Интересный факт:</strong> ${dish.fact}`;

        const stepsList = document.getElementById('viewRecipeSteps');
        stepsList.innerHTML = '';
        dish.steps.forEach(step => {
            const li = document.createElement('li');
            li.textContent = step;
            stepsList.appendChild(li);
        });

        const ingDiv = document.getElementById('viewRecipeIngredients');
        if (dish.ingredients && dish.ingredients.length > 0) {
            ingDiv.textContent = '🍂 Вам понадобится: ' + dish.ingredients.join(', ');
        } else {
            ingDiv.textContent = '';
        }

        const img = document.getElementById('viewRecipeImage');
        const placeholder = document.getElementById('viewRecipeImagePlaceholder');
        if (dish.image) {
            img.src = dish.image;
            img.style.display = 'block';
            placeholder.style.display = 'none';
            img.onerror = () => { img.style.display = 'none'; placeholder.style.display = 'flex'; };
        } else {
            img.style.display = 'none';
            placeholder.style.display = 'flex';
        }

        openModal('modalViewRecipe');
    }

    document.getElementById('btnEditFromView').addEventListener('click', () => {
        if (!viewingDish) return;
        closeModal('modalViewRecipe');
        openRecipeEditor(viewingDish.dish, viewingDish.category, viewingDish.index);
    });

    document.getElementById('btnDeleteFromView').addEventListener('click', () => {
        if (!viewingDish) return;
        if (confirm(`Удалить рецепт «${viewingDish.dish.name}»?`)) {
            dishes[viewingDish.category].splice(viewingDish.index, 1);
            renderDishes();
            closeModal('modalViewRecipe');
        }
    });

    function deleteDish(category, index) {
        if (confirm(`Удалить рецепт «${dishes[category][index].name}»?`)) {
            dishes[category].splice(index, 1);
            renderDishes();
        }
    }

    // ============================================================
    // 10. ИНИЦИАЛИЗАЦИЯ
    // ============================================================
    renderProducts();
    renderDishes();
    renderDecor();
</script>
</body>
</html>
